name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest
      - name: Smoke test (full pipeline on synthetic data)
        run: |
          python -m turbofan_rul.synthetic --out data/synthetic
          python -m turbofan_rul.train --data-dir data/synthetic --out-dir /tmp/reports --model-dir /tmp/models
