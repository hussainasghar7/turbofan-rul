[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turbofan-rul"
version = "0.1.0"
description = "Remaining-useful-life prediction for turbofan engines (NASA C-MAPSS): classical ML baselines, deep models and deployment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Syed Hussain Asghar Abidi" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
rul-train = "turbofan_rul.train:main"
rul-synthetic = "turbofan_rul.synthetic:main"

[tool.hatch.build.targets.wheel]
packages = ["src/turbofan_rul"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
